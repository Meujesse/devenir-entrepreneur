/* ============================================================
   Simulation de conversation. Tout le déroulé — répliques,
   embranchements, saisies, plans de caméra — est dans le bloc
   <script id="config"> en bas de page.
   ============================================================ */
:root{
  --teal:#d94a3d; --teal-clair:#f6c8cf; --rose:#f28fc3; --violet:#7c7baa;
  --blanc:#ffffff; --fond:var(--teal-clair);
  --bulle-fond:#ffffff; --sur-fond:#2f3640;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--fond);
  font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}

#fit{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#cadre{position:relative}
#stage{width:1600px;height:900px;position:absolute;top:0;left:0;
  transform-origin:top left;background:var(--fond);overflow:hidden}

/* ---------- Lisa vivante ------------------------------------------------
   Le travelling se fait sur #dolly, l'idle sur .pose : deux couches
   distinctes, sinon le zoom écraserait la respiration. Le point de fuite
   du zoom est le visage, calculé par pose, pour qu'elle grandisse sans
   sortir du cadre.                                                       */
#lisa{position:absolute;left:0;right:0;bottom:0;height:880px;z-index:3;
  pointer-events:none;filter:drop-shadow(0 18px 34px rgba(90,30,40,.20))}
#dolly{position:absolute;inset:0;
  transform-origin:var(--ox) var(--oy);
  transform:scale(var(--z,1)) translate(var(--dx,0px),var(--dy,0px));
  transition:transform 1.15s cubic-bezier(.45,.02,.2,1)}
.pose{position:absolute;opacity:0;
  transform:scale(.99);
  transition:opacity .5s ease,transform .6s cubic-bezier(.34,1.3,.5,1);
  transform-origin:var(--appui) 100%}
.pose.vu{opacity:1;transform:none;animation:appui 11.3s ease-in-out infinite alternate}
.c{position:absolute;inset:0;background:var(--img) no-repeat center/100% 100%}

.jambes{-webkit-mask-image:linear-gradient(to top,#000 calc(var(--taille) - 34px),
                                           transparent calc(var(--taille) + 34px));
        mask-image:linear-gradient(to top,#000 calc(var(--taille) - 34px),
                                   transparent calc(var(--taille) + 34px))}
.buste{-webkit-mask-image:linear-gradient(to top,
   transparent calc(var(--taille) - 34px), #000 calc(var(--taille) + 34px),
   #000 calc(var(--nuque) - 26px), transparent calc(var(--nuque) + 26px));
       mask-image:linear-gradient(to top,
   transparent calc(var(--taille) - 34px), #000 calc(var(--taille) + 34px),
   #000 calc(var(--nuque) - 26px), transparent calc(var(--nuque) + 26px));
  transform-origin:50% calc(100% - var(--taille));
  animation:souffle 4.6s ease-in-out infinite}
.paup{position:absolute;opacity:0;pointer-events:none;
  background-repeat:no-repeat;background-size:100% 100%}

/* ---------- la parole --------------------------------------------------
   La bouche n'est pas une suite d'images qu'on echange : elle est redessinee
   a chaque image de l'ecran, a partir de la photo, avec des valeurs qui
   glissent en continu. C'est la seule facon d'avoir a la fois du net (aucune
   copie superposee, aucun fondu) et du fluide (aucune saccade entre deux
   dessins).                                                               */
.bouche{position:absolute;opacity:0;pointer-events:none}
.bouche.vu{opacity:1}
.tete{-webkit-mask-image:linear-gradient(to top,
   transparent calc(var(--nuque) - 26px), #000 calc(var(--nuque) + 26px));
      mask-image:linear-gradient(to top,
   transparent calc(var(--nuque) - 26px), #000 calc(var(--nuque) + 26px));
  transform-origin:50% calc(100% - var(--nuque));
  animation:derive 7.3s ease-in-out infinite alternate}

@keyframes appui{from{transform:rotate(-.17deg)} to{transform:rotate(.19deg)}}
@keyframes souffle{0%{transform:scale(1,1)}38%{transform:scale(1.0035,1.007)}
                   100%{transform:scale(1,1)}}
@keyframes derive{from{transform:rotate(-.45deg) translateY(.6px)}
                  to  {transform:rotate(.5deg) translateY(-.5px)}}
@media (prefers-reduced-motion: reduce){
  .pose.vu,.buste,.tete{animation:none}
  .bouche{opacity:0!important}
  #dolly{transition-duration:.01s}
}


/* ---------- le regard ---------------------------------------------------
   L'iris est un calque a part, pose sur la boite des yeux deja mesuree.
   Sous lui, le blanc de l'oeil a ete repeint la ou l'iris se trouvait ; un
   masque legerement plus large que le disque l'empeche de mordre la
   paupiere quand il se deplace. Le dessin d'origine n'est pas retouche.  */
.oeil{position:absolute;pointer-events:none}
.oeil .fondoeil,.oeil .cadreiris{position:absolute;inset:0}
.oeil img{position:absolute;inset:0;width:100%;height:100%;display:block}
.cadreiris{-webkit-mask-size:100% 100%;mask-size:100% 100%;
           -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.cadreiris img{transition:transform .34s cubic-bezier(.32,.72,.3,1)}
/* la tete et le buste repondent au curseur : deux amplitudes differentes,
   sinon le personnage glisse d'un bloc au lieu de tourner. */
#dolly{will-change:transform}
@media (prefers-reduced-motion: reduce){
  .cadreiris img{transition:none}
}

/* ---------- le fil de conversation ------------------------------------ */
/* Le fil et la zone de reponse ne sont pas deux blocs poses chacun dans
   son coin : c'est une seule colonne centree verticalement. La reponse
   reste donc collee sous la derniere replique, au lieu de tomber en bas
   de l'ecran avec un grand vide au milieu. */
#colonne{position:absolute;left:var(--col,524px);right:54px;top:44px;bottom:48px;z-index:6;
  transition:left .8s cubic-bezier(.45,.02,.2,1);
  display:flex;flex-direction:column;justify-content:center;gap:38px;
  pointer-events:none;padding-bottom:0;
  transition:padding-bottom .9s cubic-bezier(.45,.02,.2,1)}
.fin #colonne{padding-bottom:300px}
#fil{display:flex;flex-direction:column;gap:20px;pointer-events:none}
/* La zone de reponse reserve sa vraie hauteur dans la colonne. Sinon les
   boutons, qui sont poses en absolu et poussent vers le HAUT, remontent sur
   la derniere bulle de Lisa des qu'une reponse tient sur trois lignes. */
#bas{position:relative;flex:0 0 auto;height:var(--hbas,98px);min-height:98px;
  transition:height .3s ease}
.msg{pointer-events:auto;max-width:100%;
  opacity:0;transform:translateY(26px) scale(.94);
  transition:opacity .1s linear,transform .1s linear}
.msg.vu{opacity:1;transform:none;
  transition:opacity .34s ease,transform .52s cubic-bezier(.28,1.4,.45,1)}
/* Les répliques plus anciennes reculent : le fil garde une profondeur et
   l'œil sait tout de suite où est la dernière chose dite. */
.msg.vieux{opacity:.6;transform:scale(.97)}
.msg.parti{opacity:0;transform:translateY(-16px) scale(.95);
  transition:opacity .4s ease,transform .4s ease}

/* Lisa parle à gauche du fil, l'apprenant répond à droite */
.bulle{position:relative;background:var(--bulle-fond);
  border:2.5px solid var(--teal);border-radius:22px;
  padding:25px 34px;color:#16323c;font-size:38px;line-height:1.3;
  box-shadow:0 12px 30px rgba(9,58,72,.18);width:fit-content;max-width:100%}
.bulle b{color:var(--teal);font-weight:700}
.bulle::before,.bulle::after{content:"";position:absolute;width:0;height:0;
  border-style:solid}
.bulle.gauche::before{left:-29px;bottom:26px;border-width:16px 29px 16px 0;
  border-color:transparent var(--teal) transparent transparent}
.bulle.gauche::after{left:-23px;bottom:30px;border-width:12px 23px 12px 0;
  border-color:transparent var(--bulle-fond) transparent transparent}
.msg.moi{align-self:flex-end}
.bulle.moi{background:var(--rose);border-color:transparent;color:#fff;
  font-weight:700;box-shadow:0 12px 28px rgba(234,31,92,.4)}
.bulle.moi::before{right:-27px;bottom:26px;border-width:15px 0 15px 27px;
  border-color:transparent transparent transparent var(--rose)}
.bulle.moi::after{display:none}

/* ---------- les trois petits points ------------------------------------
   Lisa « écrit » avant chaque réplique. C'est le signal que quelqu'un est
   au bout du fil, et ça donne son rythme à la conversation. */
.points{display:flex;gap:10px;align-items:center;padding:26px 30px}
.points i{width:13px;height:13px;border-radius:50%;background:var(--teal);
  opacity:.35;animation:pointe 1.25s ease-in-out infinite}
.points i:nth-child(2){animation-delay:.16s}
.points i:nth-child(3){animation-delay:.32s}
@keyframes pointe{0%,100%{opacity:.3;transform:translateY(0)}
                  40%{opacity:1;transform:translateY(-6px)}}

/* ---------- les réponses au choix -------------------------------------- */
#choix{position:absolute;left:0;right:0;bottom:0;z-index:8;
  display:flex;flex-wrap:wrap;gap:30px;justify-content:flex-end;
  align-items:stretch;opacity:0;pointer-events:none;
  transition:opacity .35s ease}
#choix.vu{opacity:1;pointer-events:auto}
@keyframes arrivee{from{opacity:0;transform:translateY(20px) scale(.9)}
                   to{opacity:1;transform:none}}
#choix .rep:nth-child(2){animation-delay:.12s}
#choix .rep:nth-child(3){animation-delay:.24s}
.rep{position:relative;background:var(--rose);color:#fff;border:none;
  animation:arrivee .42s cubic-bezier(.3,1.4,.5,1) both;
  font-family:inherit;font-size:34px;font-weight:700;line-height:1.25;
  text-align:left;border-radius:24px;padding:20px 30px;cursor:pointer;
  max-width:52%;box-shadow:0 10px 24px rgba(234,31,92,.4);
  transform-origin:100% 100%;
  transition:transform .26s cubic-bezier(.3,1.5,.5,1),box-shadow .26s,
             background .26s}
/* la réponse survolée grossit, l'autre s'efface : le choix se fait à l'œil
   avant de se faire à la souris */
.rep:hover,.rep:focus-visible{outline:none;transform:scale(1.06);
  box-shadow:0 18px 38px rgba(234,31,92,.52)}
#choix.survol .rep:not(:hover):not(:focus-visible){transform:scale(.96);
  opacity:.62;box-shadow:0 6px 16px rgba(234,31,92,.26)}
.rep:active{transform:scale(1.02)}
.rep::before{content:"";position:absolute;right:-26px;bottom:24px;
  width:0;height:0;border-style:solid;border-width:14px 0 14px 26px;
  border-color:transparent transparent transparent var(--rose);
  opacity:0;transition:opacity .2s}
.rep:hover::before{opacity:1}

/* ---------- la saisie libre -------------------------------------------- */
#saisie{position:absolute;left:0;right:0;bottom:0;z-index:8;
  display:flex;gap:14px;justify-content:flex-end;align-items:center;
  opacity:0;pointer-events:none;transition:opacity .35s ease}
#saisie.vu{opacity:1;pointer-events:auto}
#champ{flex:0 1 620px;font-family:inherit;font-size:32px;font-weight:600;
  color:var(--sur-fond);background:#fff;border:2.5px solid var(--teal);
  border-radius:24px;padding:19px 26px;outline:none;
  box-shadow:0 10px 26px rgba(9,58,72,.18);transition:box-shadow .25s,border-color .25s}
#champ::placeholder{color:#8aa7b1;font-weight:500}
#champ:focus{border-color:var(--rose);
  box-shadow:0 10px 26px rgba(234,31,92,.3),0 0 0 4px rgba(234,31,92,.16)}
#envoyer{font-family:inherit;font-size:29px;font-weight:700;color:#fff;
  background:var(--rose);border:none;border-radius:999px;padding:18px 34px;
  cursor:pointer;box-shadow:0 10px 24px rgba(234,31,92,.4);
  transition:transform .22s cubic-bezier(.34,1.5,.5,1),box-shadow .22s,opacity .22s}
#envoyer:hover{transform:translateY(-3px) scale(1.04);
  box-shadow:0 16px 32px rgba(234,31,92,.5)}
#envoyer:disabled{opacity:.4;cursor:default;transform:none;
  box-shadow:0 6px 14px rgba(234,31,92,.2)}

/* ---------- la fin ------------------------------------------------------ */
/* Les trois zones du bas se superposent : tant qu'une zone est masquee,
   elle ne doit surtout pas intercepter les clics de celle du dessous. */
/* La fleche grise de Genially est collee au bord droit, a mi-hauteur : le
   rappel se place juste a cote d'elle, sinon il designe le vide. */
#final{position:absolute;right:34px;top:50%;transform:translateY(-50%);z-index:8;
  display:flex;align-items:center;gap:12px;max-width:400px;
  background:rgba(255,255,255,.74);border-radius:999px;padding:16px 22px 16px 28px;
  box-shadow:0 12px 30px rgba(9,58,72,.16);
  color:var(--sur-fond);font-size:24px;font-weight:700;line-height:1.2;
  opacity:0;pointer-events:none;transition:opacity .5s ease}
#final.vu{opacity:1}
#final .fleche{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;
  animation:pousse 1.6s ease-in-out infinite}
#final .fleche svg{width:34px;height:34px;fill:none;stroke:var(--rose);
  stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes pousse{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}

/* ---------- confettis ---------- */
.conf{position:absolute;top:-40px;border-radius:2px;pointer-events:none;z-index:25}

/* ---------- reprendre du début ---------- */
#recommencer{position:absolute;right:26px;top:22px;z-index:9;
  font-family:inherit;font-size:15px;font-weight:700;color:var(--sur-fond);
  background:rgba(255,255,255,.55);border:none;border-radius:999px;
  padding:9px 18px;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .35s ease,background .2s}
#recommencer.vu{opacity:.75;pointer-events:auto}
#recommencer:hover{opacity:1;background:#fff}
</style>
</head>

const REGARD = {};
const TOILES = {};
const YEUXCALQ = {};

const $ = s => document.querySelector(s);
let doux = matchMedia('(prefers-reduced-motion: reduce)').matches;

const lisa   = $('#lisa'), dolly = $('#dolly');
const fil    = $('#fil'),  zoneChoix = $('#choix');
const zoneSaisie = $('#saisie'), champ = $('#champ'), envoyer = $('#envoyer');
const final_ = $('#final'), annonce = $('#annonce');

/* ---------- Lisa : trois couches par pose ---------- */
/* Chaque pose a SA taille et SA place.
   Avant, toutes les planches faisaient 880 px et la camera zoomait dessus :
   on voyait toujours la meme posture, en plus gros. Maintenant le cadrage
   vient de la photo elle-meme — plein pied, plan taille ou buste — et c'est
   la posture qui change. Une pose n'est donc plus calee sur le sol (un buste
   n'a pas de pieds) mais sur les YEUX : on decide ou doit tomber le regard
   sur la scene, et la planche se place autour. C'est ce qui evite que le
   visage saute d'un cadrage a l'autre. */
const CADRES = (CFG.lisa && CFG.lisa.cadres) || {};
const H_DEF  = 880;
function hauteurDe(cle){ return (CADRES[cle] && CADRES[cle].h) || H_DEF; }

function batitPose(cle){
  const a = ANAT[cle], cad = CADRES[cle] || {};
  const H = hauteurDe(cle);
  const l = Math.round(a.W / a.H * H);
  const y = YEUX[cle];
  const k = y ? H / y.H : 1;
  // milieu des deux yeux, en px dans la planche affichee
  const ex = y ? (y.x + y.w/2) * k : a.col * l;
  const ey = y ? (y.y + y.h/2) * k : H * (1 - a.nuque) - H * 0.06;
  const cible = cad.oeil || [CFG.lisa.tete, 175];
  const left = Math.round(Math.min(Math.max(cible[0] - ex, 4), 1596 - l));
  const top  = Math.round(cible[1] - ey);
  const d = document.createElement('div');
  d.className = 'pose'; d.dataset.pose = cle;
  d.style.cssText =
    `--img:url(${IMG[cle]});`
    + `--taille:${(a.taille*H).toFixed(1)}px;`
    + `--nuque:${(a.nuque*H).toFixed(1)}px;`
    + `--appui:${(a.appui*100).toFixed(1)}%;`
    + `width:${l}px;height:${H}px;`
    + `left:${left}px;top:${top}px;`;
  d.innerHTML = '<div class="c jambes"></div><div class="c buste"></div>'
              + '<div class="c tete"></div>';
  const b = BOUCHE[cle];
  if(b){
    // Les courbes des levres sont relevees pixel par pixel dans le dessin :
    // a bouche fermee leur bruit ne se voit pas, mais des qu'on les ecarte il
    // devient un bord en dents de scie. On les lisse une fois pour toutes.
    if(!b.lisse){
      // seule planche ou la levre du bas porte un reflet marque dans une
      // bouche deja ouverte : la seule qui a besoin d'etre translatee.
      b.levreEntiere = (cle === 'question') ? 1 : 0;
      b.alignBas    = (cle === 'question') ? 1 : 0;
      // « hanches » : bouche petite dont la source contient deja commissures
      // et coins ombres — les effets rajoutes ne font que l'alourdir.
      b.arcPlein       = (cle === 'hanches') ? 1 : 0;
      b.sansOmbreCoins = (cle === 'hanches') ? 1 : 0;
      // la bouche du plein pied est petite : on articule un peu plus fort,
      // sinon la parole se voit moins que sur les autres poses
      b.ampli          = (cle === 'hanches') ? 1.45 : 1;
      // Reglages trouves par mesure sur cette seule planche : les dents
      // n'apparaissent qu'a partir d'une vraie ouverture et montent
      // progressivement. Les autres poses gardent seuil 0 (dents immediates).
      b.dentSeuil = (cle === 'question') ? 0.28 : 0;
      b.dentMonte = (cle === 'question') ? 0.22 : 0.001;
      // Variantes comparables sans rien reinstaller : ajouter ?bouche=tardif,
      // ?bouche=calme ou ?bouche=fixe a la fin de l'adresse. Sans rien, c'est
      // le reglage retenu par la mesure.
      if(cle === 'question'){
        const v = new URLSearchParams(location.search).get('bouche');
        if(v === 'tardif'){ b.dentSeuil = 0.42; b.dentMonte = 0.26; }
        else if(v === 'calme'){ b.dentSeuil = 0.34; b.dentMonte = 0.24; b.calme = 0.7; }
        else if(v === 'fixe'){ b.figee = 1; }
      }
      const doux = (A) => {
        const n = A.length, r = Math.max(2, Math.round(n * 0.035)), S = new Array(n);
        for(let i = 0; i < n; i++){
          let som = 0, cpt = 0;
          for(let j = Math.max(0, i-r); j <= Math.min(n-1, i+r); j++){ som += A[j]; cpt++; }
          S[i] = som / cpt;
        }
        return S;
      };
      b.U = doux(b.U); b.B = doux(b.B);
      // Pas de dents relevees dans la planche : la bouche y est fermee.
      // On bride alors son ouverture, sinon on lui invente une forme que le
      // dessin ne contient pas.
      b.bride = 1;   // ouv=1 vaut deja le sourire du dessin : rien a brider
      b.lisse = 1;
    }
    const kb = H / b.H;   // H local : la hauteur de CETTE pose
    const cv = document.createElement('canvas');
    cv.className = 'bouche';
    cv.style.cssText = `left:${(b.x*kb).toFixed(1)}px;top:${(b.y*kb).toFixed(1)}px;`
      + `width:${(b.w*kb).toFixed(1)}px;height:${(b.h*kb).toFixed(1)}px`;
    // Une toile est rasterisee a la taille de sa memoire puis agrandie par le
    // zoom de la camera : si on ne prevoit pas le plan le plus rapproche, elle
    // est reechantillonnee deux fois et devient molle.
    const zoomMax = Math.max(...Object.values(CFG.plans || {loin:{z:1}}).map(p => p.z || 1));
    const r = Math.min(4, Math.max((devicePixelRatio || 1) * zoomMax, 128 / (b.w * kb)));
    cv.width  = Math.round(b.w * kb * r);
    cv.height = Math.round(b.h * kb * r);
    cv.dataset.pose = cle;
    d.querySelector('.tete').appendChild(cv);
    const src = new Image();
    src.src = BOUCHE_HD[cle] || IMG[cle];
    const hk = BOUCHE_HD[cle] ? (b.hk || 1) : 0;   // 0 = on lit dans la planche entiere
    TOILES[cle] = {cv, ctx: cv.getContext('2d'), src, kb, r, b, hk};
  }
  const rg = REGARD[cle];
  if(rg){
    // meme geometrie que la paupiere : la boite des yeux de la pose
    const o = document.createElement('div');
    o.className = 'oeil';
    o.style.cssText = `left:${(y.x*k).toFixed(1)}px;top:${(y.y*k).toFixed(1)}px;`
      + `width:${(y.w*k).toFixed(1)}px;height:${(y.h*k).toFixed(1)}px;`;
    o.innerHTML = `<div class="fondoeil"><img src="${rg.fond}" alt=""></div>`
      + `<div class="cadreiris" style="-webkit-mask-image:url(${rg.clip});`
      + `mask-image:url(${rg.clip})"><img src="${rg.iris}" alt=""></div>`;
    d.querySelector('.tete').appendChild(o);
    YEUXCALQ[cle] = {iris: o.querySelector('.cadreiris img'), amp: rg.amp * k};
  }
  if(y){
    const pa = document.createElement('div');
    pa.className = 'paup';
    pa.style.cssText = `left:${(y.x*k).toFixed(1)}px;top:${(y.y*k).toFixed(1)}px;`
      + `width:${(y.w*k).toFixed(1)}px;height:${(y.h*k).toFixed(1)}px;`
      + `background-image:url(${CLOS[cle]})`;
    d.querySelector('.tete').appendChild(pa);
  }
  dolly.appendChild(d);
  return d;
}
Object.keys(IMG).forEach(batitPose);

/* Le point de fuite du travelling est le visage de la pose affichée :
   en zoomant autour de lui, Lisa grandit sans jamais sortir du cadre. */
function pointDeFuite(cle){
  const cad = CADRES[cle] || {};
  return cad.oeil || [CFG.lisa.tete, 175];
}

let poseActuelle = null;
function montre(cle){
  if(cle === poseActuelle) return;
  Object.values(TOILES).forEach(T => T.cv.classList.remove('vu'));
  poseActuelle = cle;
  taitToi();
  dolly.querySelectorAll('.pose').forEach(p =>
    p.classList.toggle('vu', p.dataset.pose === cle));
  const [ox, oy] = pointDeFuite(cle);
  dolly.style.setProperty('--ox', ox.toFixed(1) + 'px');
  dolly.style.setProperty('--oy', oy.toFixed(1) + 'px');
  // La colonne de texte recule quand Lisa prend plus de place : sur un buste
  // elle occupe la moitie gauche de la scene, les bulles ne doivent pas lui
  // tomber sur le visage.
  const col = (CADRES[cle] && CADRES[cle].colonne) || 524;
  const zc = document.querySelector('#colonne');
  if(zc) zc.style.setProperty('--col', col + 'px');
}

/* Les plans de caméra. « loin » : elle est entière, on découvre la scène.
   « moyen » : on se rapproche quand la conversation devient personnelle.
   « pres » : gros plan sur les moments qui comptent. */
const PLANS = CFG.plans || { loin:{z:1,dx:0,dy:0}, moyen:{z:1.34,dx:0,dy:40},
                             pres:{z:1.85,dx:0,dy:96} };
let planActuel = null;
function cadre(nom){
  const p = PLANS[nom] || PLANS.loin;
  if(planActuel === nom) return;
  planActuel = nom;
  dolly.style.setProperty('--z',  p.z);
  dolly.style.setProperty('--dx', (p.dx||0) + 'px');
  dolly.style.setProperty('--dy', (p.dy||0) + 'px');
}

/* ---------- gestes ---------- */
const hasard = (a,b) => a + Math.random()*(b-a);
function couche(sel){
  const p = dolly.querySelector('.pose.vu');
  return p ? p.querySelector(sel) : null;
}
function hoche(force){
  const t = couche('.tete'); if(!t || doux) return;
  t.animate([{transform:'rotate(0deg)'},
             {transform:`rotate(${-1.15*force}deg)`, offset:.3},
             {transform:`rotate(${.42*force}deg)`,  offset:.68},
             {transform:'rotate(0deg)'}],
            {duration:780/force, easing:'ease-in-out', composite:'add'});
}
function epaules(){
  const b = couche('.buste'); if(!b || doux) return;
  b.animate([{transform:'translateY(0)'},{transform:'translateY(-2.6px)', offset:.34},
             {transform:'translateY(0)'}],
            {duration:900, easing:'ease-in-out', composite:'add'});
}
function inspire(){
  const b = couche('.buste'); if(!b || doux) return;
  b.animate([{transform:'scale(1,1)'},{transform:'scale(1.006,1.013)', offset:.42},
             {transform:'scale(1,1)'}],
            {duration:2600, easing:'ease-in-out', composite:'add'});
}
function clignote(duree){
  const p = dolly.querySelectorAll('.pose.vu .paup');
  if(!p.length || doux) return;
  p.forEach(el => el.animate([
    {opacity:0, offset:0,   easing:'cubic-bezier(.45,0,.85,1)'},
    {opacity:1, offset:.19, easing:'linear'},
    {opacity:1, offset:.55, easing:'cubic-bezier(.1,0,.35,1)'},
    {opacity:0, offset:1}
  ], {duration: duree || (195 + Math.random()*45)}));
}

/* =====================================================================
   Le regard
   ---------------------------------------------------------------------
   Trois comportements se superposent, du plus lent au plus rapide :
     - l'ANCRE : ou Lisa regarde en ce moment. Vers l'interlocuteur quand
       elle ecoute, vers la bulle quand elle parle.
     - le CURSEUR : elle suit la souris, mais faiblement — un suivi trop
       franc donne un personnage qui louche.
     - les SACCADES : l'oeil humain ne se pose jamais. Toutes les deux ou
       trois secondes, un micro-deplacement, puis retour.
   ===================================================================== */
let regardX = 0, regardY = 0, ancreX = 0, ancreY = 0, saccX = 0, saccY = 0;
let sourisX = 0, sourisY = 0;

function poseRegard(){
  const x = Math.max(-1, Math.min(1, ancreX + sourisX*0.42 + saccX));
  const y = Math.max(-1, Math.min(1, ancreY + sourisY*0.30 + saccY));
  regardX += (x - regardX) * 0.16;
  regardY += (y - regardY) * 0.16;
  const C = YEUXCALQ[poseActuelle];
  if(C) C.iris.style.transform =
    `translate(${(regardX*C.amp).toFixed(2)}px,${(regardY*C.amp*0.55).toFixed(2)}px)`;
  // la tete et le buste suivent de tres loin : la parallaxe se sent sans se voir
  const p = dolly.querySelector('.pose.vu');
  if(p && !doux){
    const t = p.querySelector('.tete'), b = p.querySelector('.buste');
    if(t) t.style.translate = `${(sourisX*5.5).toFixed(2)}px ${(sourisY*2.6).toFixed(2)}px`;
    if(b) b.style.translate = `${(sourisX*2.2).toFixed(2)}px ${(sourisY*1.0).toFixed(2)}px`;
  }
  requestAnimationFrame(poseRegard);
}

addEventListener('pointermove', e => {
  const r = document.getElementById('stage').getBoundingClientRect();
  if(!r.width) return;
  sourisX = Math.max(-1, Math.min(1, ((e.clientX - r.left)/r.width  - .5) * 2));
  sourisY = Math.max(-1, Math.min(1, ((e.clientY - r.top )/r.height - .5) * 2));
}, {passive:true});

function saccade(){
  const amp = Math.random() < .25 ? .55 : .22;
  saccX = (Math.random()*2 - 1) * amp;
  saccY = (Math.random()*2 - 1) * amp * .5;
  setTimeout(() => { saccX = 0; saccY = 0; }, 260 + Math.random()*420);
  setTimeout(saccade, 1500 + Math.random()*2600);
}

/* Quand elle parle, elle regarde ce qu'elle dit : la colonne est a DROITE
   de Lisa, donc le regard part vers la droite et remonte un peu. Quand elle
   se tait, elle revient sur l'interlocuteur. */
function regardeLeTexte(oui){
  ancreX = oui ? 0.62 : 0;
  ancreY = oui ? -0.18 : 0;
}
requestAnimationFrame(poseRegard);
saccade();

/* =====================================================================
   La parole
   ---------------------------------------------------------------------
   Trois choses font qu'une bouche parait vivante, et il a fallu les trois :

   1. Elle suit le TEXTE. On decoupe la replique en syllabes francaises et
      chaque voyelle donne sa forme. Sans bande son, c'est la seule chose
      qui rend la parole credible.
   2. Elle bouge en CONTINU. Pas de suite d'images echangees : les valeurs
      glissent vers leur cible a chaque image de l'ecran. On ne voit plus
      les etapes.
   3. Elle est REDESSINEE, pas etiree. Le bas du visage est repeint depuis
      la photo, et l'interieur de la bouche — dents, fond de gorge — est
      construit a la bonne taille. Aucune copie superposee, donc aucun flou.

   En prime, le sourire se detend quand elle ouvre la bouche : on ne peut pas
   tenir un sourire large en articulant.
   ===================================================================== */

/*                ouverture  largeur   biais   (l'ouverture est un multiple
                                                de l'ouverture naturelle) */
const FORMES = {MBP:[0.00, -0.030,  0.00],
                pet:[0.32, +0.010, +0.05],
                E:  [0.60, +0.048, -0.04],
                A:  [0.86, +0.014, +0.03],
                O:  [0.64, -0.058, -0.05],
                U:  [0.36, -0.072, +0.04],
                rep:[0.00,  0.000,  0.00]};

const GROUPES = [
  ['eau','O'],['ain','E'],['ein','E'],['oin','U'],
  ['au','O'],['ou','U'],['oi','WA'],['oy','WA'],['ui','U'],['eu','U'],
  ['ey','E'],['ay','E'],
  ['ai','E'],['ei','E'],['an','A'],['am','A'],['en','A'],['em','A'],
  ['in','E'],['im','E'],['on','O'],['om','O'],['un','U'],['um','U'],
  ['a','A'],['e','E'],['i','E'],['y','E'],['o','O'],['u','U']
];

function syllabes(texte){
  const t = String(texte).normalize('NFD').replace(/[̀-ͯ]/g,'')
              .toLowerCase().replace(/[^a-z' ]+/g,' ');
  const suite = [];
  for(const mot of t.split(/\s+/).filter(Boolean)){
    const debut = suite.length;
    let i = 0;
    while(i < mot.length){
      let tr = null;
      for(const [g, v] of GROUPES) if(mot.startsWith(g, i)){ tr = [g, v]; break; }
      if(!tr){ i++; continue; }
      const [g, v] = tr, reste = mot.slice(i + g.length);
      if(v === 'E' && g === 'e' && mot.length > 1
         && (reste === '' || reste === 's' || reste === 'nt')){ i += g.length; continue; }
      const avant = i > 0 ? mot[i-1] : '';
      const ferme = !avant ? null
                  : 'mbp'.includes(avant) ? 'MBP'
                  : 'fv'.includes(avant)  ? 'pet' : null;
      if(v === 'WA'){ suite.push({v:'U', ferme, court:true}); suite.push({v:'A'}); }
      else suite.push({v, ferme});
      i += g.length;
    }
    if(suite.length > debut) suite[suite.length-1].fin = true;
  }
  return suite;
}

/* ---------- le dessin ---------- */
const rgb = c => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
const teinte = (c, f) => 'rgb(' + Math.round(c[0]*f) + ',' + Math.round(c[1]*f)
                                + ',' + Math.round(c[2]*f) + ')';

function dessineBouche(cle, ouv, larg, biais){
  const T = TOILES[cle];
  if(!T || !T.src.complete || !T.src.naturalWidth) return;
  if(T.b.figee){ T.cv.classList.remove('vu'); return; }   // bouche non animee
  ouv *= (T.b.bride || 1) * (T.b.calme || 1);
  const ctx = T.ctx, cv = T.cv, b = T.b, s = T.kb * T.r;
  // coordonnees dans la source : morceau HD (origine 0,0) ou planche entiere
  const hk = T.hk, ox = hk ? 0 : b.x, oy = hk ? 0 : b.y, h = hk || 1;
  const sw = 1 / s;                       // largeur d'une colonne dans la source
  ctx.clearRect(0, 0, cv.width, cv.height);
  if(ouv <= 0.002 && Math.abs(larg) < 0.002){ cv.classList.remove('vu'); return; }
  cv.classList.add('vu');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  const HP = b.h, W = b.w, N = cv.width;
  // Sur la pose qui l'exige, les deux levres restent rigoureusement alignees :
  // pas de biais lateral, et le meme suivi d'etirement en haut et en bas.
  const cx = b.cx + biais * b.mw * (b.alignBas ? 0 : 0.34),
        demi = b.mw * 0.62, demiJ = b.mw * 1.05;
  // sur une bouche fermee, les levres se separent a peine : trop d'ouverture
  // donne une entaille au milieu du visage.
  const Gmin = b.mw * 0.076;
  const haut = new Float32Array(N), basI = new Float32Array(N);
  let ymin = 1e9, ymax = -1e9, ouvert = false;

  for(let xd = 0; xd < N; xd++){
    const xr = (xd + 0.5) / s;
    const i = Math.min(W - 1, Math.max(0, Math.round(xr)));
    const u = b.U[i], b0 = b.B[i];
    const cl = Math.cos(Math.min(1, Math.abs(xr - cx) / demi)  * Math.PI / 2) ** 2;
    const cj = Math.cos(Math.min(1, Math.abs(xr - cx) / demiJ) * Math.PI / 2) ** 2;
    // L'ouverture garde la FORME de sa bouche : on ne la remplace pas par une
    // cloche, on multiplie celle qui existe. A ouverture 1, on retombe sur son
    // sourire d'origine ; a 0, les levres se ferment.
    const g0 = Math.max(b0 - u, 0);                       // l'ouverture du dessin
    const g = ouv * (b.ampli || 1) * Math.max(b0 - u, Gmin * Math.pow(cl, 1.25));
    const ecart = g - g0;                                // ce qu'on ouvre EN PLUS
    const detente = 0.12 * ouv * b.ep * (1 - cl) * cj;   // le sourire se detend
    // la machoire descend : le bas prend l'essentiel du mouvement, le haut se
    // souleve a peine. A ecart nul on retombe pile sur le dessin d'origine.
    const ut = u - 0.22 * ecart + detente;
    const bc = ut + g;
    haut[xd] = ut * s; basI[xd] = bc * s;
    if(g > 0.25){ ouvert = true;
      if(ut * s < ymin) ymin = ut * s;
      if(bc * s > ymax) ymax = bc * s; }
    const ex = (xr - cx) / (1 + larg * cj);
    const xh = b.alignBas ? cx + ex : cx + ex * 0.86 + (xr - cx) * 0.14;
    const xb = cx + ex;
    if(ut > 0.05)
      ctx.drawImage(T.src, ox + xh * h, oy, sw * h, u * h, xd, 0, 1, ut * s);
    if(bc < HP - 0.05){
      if(b.levreEntiere){
        // la levre du bas garde sa hauteur reelle : translatee, pas etiree
        const epL = Math.min(b.ep * (b.epFacteur || 0.50), (HP - b0) * 0.45);
        // On peut prendre la source un peu PLUS HAUT que le bas de l'ouverture :
        // on reprend alors un peu de cavite sombre, qui vient s'intercaler
        // entre les dents et le reflet de la levre. C'est ce qui les separe.
        const dec = Math.min(b.decalBas || 0, Math.max(0, b0 - u));
        ctx.drawImage(T.src, ox + xb * h, oy + (b0 - dec) * h, sw * h, epL * h,
                      xd, bc * s, 1, epL * s);
        const r0 = b0 - dec + epL, r1 = bc + epL;    // le menton absorbe l'ecart
        if(r1 < HP - 0.05)
          ctx.drawImage(T.src, ox + xb * h, oy + r0 * h, sw * h, (HP - r0) * h,
                        xd, r1 * s, 1, (HP - r1) * s);
      } else {
        ctx.drawImage(T.src, ox + xb * h, oy + b0 * h, sw * h, (HP - b0) * h,
                      xd, bc * s, 1, (HP - bc) * s);
      }
    }
  }
  if(!ouvert) return;
  /* On ne trace que la ou la bouche est reellement ouverte. Sinon le chemin
     se referme d'un bord a l'autre du cadre et laisse un trait qui traverse
     tout le visage. */
  const ouverte = new Uint8Array(N);
  for(let x = 0; x < N; x++) ouverte[x] = (basI[x] - haut[x]) > 0.35 ? 1 : 0;
  function bande(dessus, dessous){
    ctx.beginPath();
    let x = 0;
    while(x < N){
      while(x < N && !ouverte[x]) x++;
      const a = x;
      while(x < N && ouverte[x]) x++;
      if(x - a < 2) continue;
      for(let i = a; i < x; i++) ctx.lineTo(i + .5, dessus(i));
      for(let i = x - 1; i >= a; i--) ctx.lineTo(i + .5, dessous(i));
      ctx.closePath();
    }
    ctx.fill();
  }

  /* L'interieur de la bouche.
     Quand elle sourit, ses dents sont deja peintes sur la planche : on les
     REPREND telles quelles, a leur taille reelle, sans les etirer. Les dents
     du haut sont accrochees au crane — quand la bouche s'ouvre davantage on
     n'en voit pas de plus grandes, on voit du noir en dessous ; quand elle se
     ferme, la levre du bas les recouvre. C'est exactement ce que fait le
     decoupage ci-dessous. */
  // 0,100 et non 0,058 : c'est la proportion mesuree sur « salut deux
  // mains », la posture dont l'animation fait reference. Une rangee
  // plus fine se lit comme un reflet, pas comme des dents.
  const cav = b.cav, dentsMini = 0.100 * b.mw * s;
  const ecart = x => Math.max(0, basI[x] - haut[x]);

  // 1. le fond de gorge, sur toute l'ouverture
  // Le bas de l'ouverture s'eclaircit — c'est la langue. Mais a 1,45 il
  // virait a l'orange vif, et sur une petite ouverture cette bande claire
  // collee sous les dents se lisait comme une langue mordue. On l'eclaircit
  // donc PROPORTIONNELLEMENT a l'ouverture : invisible quand elle parle
  // a peine, presente seulement quand la bouche est vraiment grande ouverte.
  // Le fond de bouche reste sombre tant qu'on est derriere les dents du
  // haut, et ne s'eclaircit qu'en bas — sinon la bande claire traverse la
  // rangee et Lisa a l'air de se mordre la langue. Une posture peut avoir
  // son propre reglage (champ « langue » du config).
  const L = b.langue || [0.70, 0.70, 0.78, 0.92, 0.30];
  // La zone claire du fond, c'est la langue : elle n'a rien a faire en haut
  // de l'ouverture. Tant qu'on est derriere les dents, le fond reste sombre ;
  // l'eclaircissement est repousse dans le dernier quart et plafonne, sinon
  // la langue semble passer DEVANT les dents.
  const basL = Math.max(L[1], 0.84);
  // Sous 45 % d'ouverture la langue n'a pas a se voir : dans une fente de
  // quelques pixels, la moindre zone claire se colle aux dents et donne
  // l'impression de passer devant elles. On fait donc croitre l'ecart de
  // teinte AVEC l'ouverture, au lieu de l'appliquer en entier des le debut.
  const force = Math.max(0, Math.min(1, (ouv - 0.62) / 0.38));
  const vers = (c) => L[0] + (c - L[0]) * force;
  const gr = ctx.createLinearGradient(0, ymin, 0, ymax);
  gr.addColorStop(0,    teinte(cav, L[0]));
  gr.addColorStop(basL, teinte(cav, vers(Math.min(L[2], L[0] + 0.03))));
  gr.addColorStop(1,    teinte(cav, vers(Math.min(L[3] + L[4] * ouv, L[0] + 0.15))));
  ctx.fillStyle = gr;
  bande(x => haut[x], x => basI[x]);

  // 2. les vraies dents, reprises dans la planche, colonne par colonne
  let vraiesDents = false;
  if(b.T){
    // Les dents n'occupent qu'une partie de la largeur de la bouche (sur
    // « question », un quart). Reduire leur hauteur par une cloche calee sur
    // toute la bouche les rabotait jusqu'a n'etre qu'un eclat blanc. On garde
    // donc la hauteur MESUREE au milieu de la rangee, et on ne fait fondre
    // que ses deux extremites — ce qui suffit a lui oter son bord d'etiquette.
    let dg = Infinity, dd = -Infinity;
    for(let i = 0; i < W; i++) if(b.T[i] >= 0.4){ if(i < dg) dg = i; if(i > dd) dd = i; }
    const marge = Math.max(2, (dd - dg) * 0.20);
    for(let xd = 0; xd < N; xd++){
      const xr = (xd + 0.5) / s;
      const i = Math.min(W - 1, Math.max(0, Math.round(xr)));
      const th = b.T[i], u = b.U[i];
      if(th < 0.4) continue;
      const fondu = Math.max(0, Math.min(1, Math.min(xr - dg, dd - xr) / marge));
      const arc = b.arcPlein ? 1 : 0.30 + 0.70 * Math.pow(fondu, 0.55);
      // laisser un peu de cavite sous les dents : sans elle, le reflet de
      // la levre du bas touche la rangee et se lit comme une langue.
      // Quand les levres se rejoignent, on ne doit voir NI dents ni rien
      // entre elles : sinon la rangee touche le reflet de la levre du bas et
      // l'oeil lit une langue devant les dents. Les dents n'apparaissent donc
      // qu'a partir d'une vraie ouverture, et grandissent progressivement.
      const seuil = (b.dentSeuil === undefined) ? 0 : b.dentSeuil;
      const monte = (b.dentMonte === undefined) ? 0.001 : b.dentMonte;
      const part = Math.max(0, Math.min(1, (ouv - seuil) / monte));
      const vis = Math.min(th * arc * part, ecart(xd) / s);
      if(vis < 0.25) continue;
      vraiesDents = true;
      // Les levres sont reechantillonnees lateralement par « larg », mais les
      // dents etaient lues a leur position d'origine : des que la bouche
      // s'etirait, la rangee glissait par rapport aux levres — le petit
      // decalage lateral restant. Sous alignBas, les dents suivent le meme
      // chemin que la levre du bas.
      let xsrc = xr;
      if(b.alignBas){
        const cjD = Math.cos(Math.min(1, Math.abs(xr - cx) / demiJ) * Math.PI / 2) ** 2;
        xsrc = cx + (xr - cx) / (1 + larg * cjD);
      }
      ctx.drawImage(T.src, ox + xsrc * h, oy + u * h, sw * h, vis * h,
                    xd, haut[xd], 1, vis * s);        // 1:1 : aucun etirement
    }
  }
  // 3. Sur une posture bouche fermee il n'y a pas de dents a reprendre dans
  //    la planche : on en pose une rangee, assez haute pour se lire comme des
  //    dents et pas comme un simple reflet, avec un degrade et une ombre sous
  //    la rangee pour qu'elle ne soit pas plate.
  if(!vraiesDents){
    const finD = x => haut[x] + Math.min(ecart(x) * 0.62, dentsMini);
    const gd = ctx.createLinearGradient(0, ymin, 0, ymin + dentsMini);
    gd.addColorStop(0, teinte(b.dents, 1.00));
    gd.addColorStop(1, teinte(b.dents, 0.86));
    ctx.fillStyle = gd;
    bande(x => haut[x], finD);
    const so = ctx.createLinearGradient(0, ymin, 0, ymin + dentsMini * 1.25);
    so.addColorStop(0, 'rgba(' + cav[0] + ',' + cav[1] + ',' + cav[2] + ',0)');
    so.addColorStop(1, 'rgba(' + cav[0] + ',' + cav[1] + ',' + cav[2] + ',.42)');
    ctx.fillStyle = so;
    bande(x => finD(x) - dentsMini * 0.30, finD);
  }

  // 3b. Les commissures sont dans l'ombre. C'est ce qui empeche l'ouverture
  //     de se lire comme une fente d'epaisseur constante posee sur le visage :
  //     la bouche prend une profondeur, et les coins se ferment doucement.
  if(!b.sansOmbreCoins){
    const xg = (cx - b.mw) * s, xd2 = (cx + b.mw) * s;
    const co = ctx.createLinearGradient(xg, 0, xd2, 0);
    const n = 'rgba(' + Math.round(cav[0]*.45) + ',' + Math.round(cav[1]*.45)
            + ',' + Math.round(cav[2]*.45) + ',';
    co.addColorStop(0,    n + (.55 * ouv).toFixed(3) + ')');
    co.addColorStop(.30,  n + '0)');
    co.addColorStop(.70,  n + '0)');
    co.addColorStop(1,    n + (.55 * ouv).toFixed(3) + ')');
    ctx.fillStyle = co;
    bande(x => haut[x], x => basI[x]);
  }

  // 3c. La levre du bas. Quand la machoire descend, c'est elle qui bouge le
  //     plus ; sans son trait, le bas de l'ouverture se terminait net sur la
  //     peau et la bouche paraissait decoupee.
  {
    const ep = Math.min(2.6 * s, dentsMini * 0.62);
    const lv = ctx.createLinearGradient(0, ymax - ep, 0, ymax);
    lv.addColorStop(0, 'rgba(' + Math.round(cav[0]*1.35) + ','
      + Math.round(cav[1]*1.30) + ',' + Math.round(cav[2]*1.25) + ',0)');
    lv.addColorStop(1, 'rgba(' + Math.round(cav[0]*1.55) + ','
      + Math.round(cav[1]*1.45) + ',' + Math.round(cav[2]*1.40) + ','
      + (.50 * Math.min(1, ouv*1.6)).toFixed(3) + ')');
    ctx.fillStyle = lv;
    bande(x => basI[x] - Math.min(ecart(x) * 0.30, ep), x => basI[x]);
  }

  // 3d. Une ombre portee SOUS la rangee de dents. C'est elle qui detache les
  //     dents de ce qui suit : sans elle, le reflet de la levre du bas vient
  //     au contact de la rangee et l'oeil lit une langue passee devant.
  if(vraiesDents && b.ombreDents){
    const finD = new Float32Array(N);
    for(let xd = 0; xd < N; xd++){
      const i = Math.min(W - 1, Math.max(0, Math.round((xd + 0.5) / s)));
      const th = b.T[i] || 0;
      finD[xd] = haut[xd] + Math.min(th * s, ecart(xd));
    }
    const ep = Math.max(1.5, dentsMini * b.ombreDents);
    const og = ctx.createLinearGradient(0, ymin, 0, ymax);
    const nn = 'rgba(' + Math.round(cav[0]*.35) + ',' + Math.round(cav[1]*.35)
             + ',' + Math.round(cav[2]*.35) + ',';
    og.addColorStop(0, nn + '.85)');
    og.addColorStop(1, nn + '.35)');
    ctx.fillStyle = og;
    bande(x => finD[x], x => Math.min(finD[x] + ep, basI[x]));
  }

  // 4. l'ombre de la levre superieure, proportionnelle a l'ouverture
  const om = ctx.createLinearGradient(0, ymin, 0, ymin + (ymax - ymin) * 0.5);
  om.addColorStop(0, 'rgba(' + cav[0] + ',' + cav[1] + ',' + cav[2] + ',.30)');
  om.addColorStop(1, 'rgba(' + cav[0] + ',' + cav[1] + ',' + cav[2] + ',0)');
  ctx.fillStyle = om;
  bande(x => haut[x], x => haut[x] + ecart(x) * 0.38);
}

/* ---------- le moteur ---------- */
let jetonParole = 0, rafBouche = 0;
const etat = {ouv:0, larg:0, biais:0}, cible = {ouv:0, larg:0, biais:0};

function tickBouche(){
  let bouge = false;
  for(const p of ['ouv','larg','biais']){
    const e = cible[p] - etat[p];
    if(Math.abs(e) > 0.0008){ etat[p] += e * 0.28; bouge = true; }
    else etat[p] = cible[p];
  }
  if(poseActuelle) dessineBouche(poseActuelle, etat.ouv, etat.larg, etat.biais);
  if(bouge || etat.ouv > 0.002) rafBouche = requestAnimationFrame(tickBouche);
  else {
    rafBouche = 0;
    const T = TOILES[poseActuelle];
    if(T) T.cv.classList.remove('vu');
  }
}
function vise(nom){
  const f = FORMES[nom] || FORMES.rep;
  cible.ouv = f[0]; cible.larg = f[1]; cible.biais = f[2];
  if(!rafBouche) rafBouche = requestAnimationFrame(tickBouche);
}
function taitToi(){ jetonParole++; vise('rep'); regardeLeTexte(false); }

async function parle(texte){
  regardeLeTexte(true);   // elle regarde ce qu'elle est en train de dire
  if(doux) return;
  const mien = ++jetonParole;
  const suite = syllabes(texte);
  if(!suite.length) return;
  for(const sy of suite){
    if(mien !== jetonParole) return;
    let ms = (sy.court ? 100 : 172) * (0.84 + Math.random() * 0.32);
    if(sy.fin) ms *= 1.4;
    if(sy.ferme){
      vise(sy.ferme);
      await attente(sy.ferme === 'MBP' ? 74 : 56);
      if(mien !== jetonParole) return;
    }
    vise(sy.v);
    if(sy.fin && ms > 210 && Math.random() < .38) hoche(0.32);
    await attente(ms);
    if(sy.fin && Math.random() < .34){
      vise(Math.random() < .6 ? 'MBP' : 'pet');
      await attente(80 + Math.random() * 90);
    }
  }
  if(mien === jetonParole){
    taitToi();
    if(Math.random() < .45) setTimeout(clignote, 180);
  }
}

function boucleClignement(){
  const t = () => {
    clignote();
    if(Math.random() < .22) setTimeout(() => clignote(185), 245);
    setTimeout(t, 1900 + Math.random()*4600);
  };
  setTimeout(t, 900 + Math.random()*2200);
}
function boucle(fn,min,max){
  const t = () => { fn(); setTimeout(t, hasard(min,max)); };
  setTimeout(t, hasard(min/2,max));
}
if(!doux){
  boucle(()=>hoche(hasard(.55,1)), 7000, 16000);
  boucle(epaules, 11000, 24000);
  boucle(inspire,  9000, 19000);
  boucleClignement();
}

/* ---------- confettis ---------- */
function confettis(n){
  if(doux || (CFG.options && CFG.options.confettis === false)) return;
  const st = $('#stage'), c = CFG.couleurs;
  const teintes = [c.rose, c.teal, '#f6c544', c.violet, '#ffffff', '#43c04a'];
  for(let i = 0; i < n; i++){
    const d = document.createElement('div');
    d.className = 'conf';
    d.style.left = (60 + Math.random()*1480) + 'px';
    d.style.width  = (7 + Math.random()*8) + 'px';
    d.style.height = (10 + Math.random()*13) + 'px';
    d.style.background = teintes[i % teintes.length];
    st.appendChild(d);
    const der = (Math.random()-.5)*300, tour = 360*(2+Math.random()*4);
    const a = d.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${der*.35}px,420px) rotate(${tour*.45}deg)`, opacity:1, offset:.55},
      {transform:`translate(${der}px,1000px) rotate(${tour}deg)`, opacity:0}
    ], {duration:2300+Math.random()*1700, delay:Math.random()*500,
        easing:'cubic-bezier(.25,.6,.5,1)'});
    a.onfinish = () => d.remove();
  }
}

/* =====================================================================
   Le fil
   ===================================================================== */
const memoire = {};                      // prénom, projet…
const attente = ms => new Promise(r => setTimeout(r, ms));

function remplace(t){
  return String(t).replace(/\{(\w+)\}/g, (m, k) =>
    memoire[k] !== undefined && memoire[k] !== '' ? '<b>'+memoire[k]+'</b>' : '');
}

/* On ne garde que les dernières répliques : au-delà, le fil déborde du
   cadre et l'ancien n'apporte plus rien. Les sortantes s'effacent vers le
   haut, comme dans une messagerie. */
const MAX_FIL = 3;
function taille(){
  const msgs = [...fil.children];
  msgs.forEach((m,i) => m.classList.toggle('vieux', i < msgs.length - 1));
  while(fil.children.length > MAX_FIL){
    const v = fil.firstElementChild;
    v.classList.add('parti');
    setTimeout(() => v.remove(), 420);
    if(fil.children.length > MAX_FIL + 1) v.remove();
    else break;
  }
}

function ajoute(html, moi){
  const d = document.createElement('div');
  d.className = 'msg' + (moi ? ' moi' : '');
  d.innerHTML = `<div class="bulle ${moi ? 'moi' : 'gauche'}">${html}</div>`;
  fil.appendChild(d);
  taille();
  requestAnimationFrame(() => d.classList.add('vu'));
  return d;
}

function pointsDeSuspension(){
  const d = document.createElement('div');
  d.className = 'msg';
  d.innerHTML = '<div class="bulle gauche points"><i></i><i></i><i></i></div>';
  fil.appendChild(d); taille();
  requestAnimationFrame(() => d.classList.add('vu'));
  return d;
}

/* Le temps d'écriture suit la longueur de la réplique, borné : une phrase
   courte ne doit pas faire attendre, une longue ne doit pas passer pour
   instantanée. */
const tempsEcriture = t => doux ? 120
  : Math.min(1500, Math.max(520, String(t).length * 17));

async function ditLisa(texte){
  const pts = pointsDeSuspension();
  await attente(tempsEcriture(texte));
  pts.remove();
  const html = remplace(texte);
  ajoute(html, false);
  annonce.textContent = html.replace(/<[^>]+>/g, '');
  const brut = html.replace(/<[^>]+>/g, '');
  parle(brut);                // volontairement non attendu
  hoche(hasard(.6, 1));
  if(Math.random() < .5) epaules();
  await attente(doux ? 60 : Math.min(1900, 380 + syllabes(brut).length * 58));
}

/* =====================================================================
   Le déroulé
   ===================================================================== */
const ETAPES = {};
CFG.etapes.forEach(e => ETAPES[e.id] = e);

const zoneBas = document.querySelector('#bas');
function hauteurBas(el){
  // mesure la hauteur reelle du bloc de reponse et la reserve dans la colonne
  if(!zoneBas) return;
  const h = el ? Math.ceil(el.getBoundingClientRect().height / echelle()) : 98;
  zoneBas.style.setProperty('--hbas', Math.max(98, h) + 'px');
}
function echelle(){
  const st = document.querySelector('#stage');
  if(!st) return 1;
  const m = /scale\(([\d.]+)\)/.exec(st.style.transform || '');
  return m ? parseFloat(m[1]) : 1;
}

function cacheTout(){
  zoneChoix.classList.remove('vu','survol');
  zoneSaisie.classList.remove('vu');
  final_.classList.remove('vu');
  hauteurBas(null);
}

function choisir(options){
  return new Promise(res => {
    zoneChoix.innerHTML = '';
    options.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'rep'; b.type = 'button';
      b.innerHTML = remplace(o.texte);
      b.onclick = () => { cacheTout(); res(o); };
      b.addEventListener('pointerenter', () => zoneChoix.classList.add('survol'));
      b.addEventListener('pointerleave', () => zoneChoix.classList.remove('survol'));
      b.addEventListener('focus', () => zoneChoix.classList.add('survol'));
      b.addEventListener('blur',  () => zoneChoix.classList.remove('survol'));
      zoneChoix.appendChild(b);
    });
    zoneChoix.classList.add('vu');
    hauteurBas(zoneChoix);
    const p = zoneChoix.querySelector('.rep');
    if(p) setTimeout(() => p.focus({preventScroll:true}), 120);
  });
}

function demander(conf){
  return new Promise(res => {
    champ.value = '';
    champ.placeholder = conf.invite || '';
    champ.maxLength = conf.max || 40;
    envoyer.textContent = conf.bouton || 'Envoyer';
    envoyer.disabled = true;
    const teste = () => { envoyer.disabled = champ.value.trim().length === 0; };
    champ.oninput = teste;
    const valide = () => {
      const v = champ.value.trim();
      if(!v) return;
      champ.oninput = null; envoyer.onclick = null; champ.onkeydown = null;
      cacheTout();
      res(v);
    };
    envoyer.onclick = valide;
    champ.onkeydown = e => { if(e.key === 'Enter') valide(); };
    zoneSaisie.classList.add('vu');
    hauteurBas(zoneSaisie);
    setTimeout(() => champ.focus({preventScroll:true}), 160);
    hoche(.5);          // elle se penche vers ce que l'apprenant écrit
    regardeLeTexte(false);
  });
}

function joueVoix(cle){
  const src = VOIX[cle];
  if(!src || doux) return;
  const a = new Audio(src);
  a.play().catch(() => {});   // si le navigateur refuse, l'activite reste muette
}

let enCours = 0;
async function joue(id, jeton){
  while(id){
    if(jeton !== enCours) return;                  // un « recommencer » est passé
    const e = ETAPES[id];
    if(!e){ console.warn('étape inconnue :', id); return; }

    if(e.pose)  montre(e.pose);
    if(e.plan){ cadre(e.plan); await attente(doux ? 40 : 260); }
    if(e.videFil){
      [...fil.children].forEach(m => { m.classList.add('parti');
                                       setTimeout(() => m.remove(), 420); });
      await attente(doux ? 40 : 380);
    }

    if(e.voix) joueVoix(e.voix);
    for(const t of (e.dit || [])){
      if(jeton !== enCours) return;
      await ditLisa(t);
    }

    if(e.saisie){
      const v = await demander(e.saisie);
      memoire[e.saisie.champ] = v;
      ajoute(v.replace(/[<>&]/g, ''), true);
      await attente(doux ? 60 : 420);
      id = e.suite;
      continue;
    }

    if(e.choix){
      const o = await choisir(e.choix);
      ajoute(remplace(o.texte), true);
      await attente(doux ? 60 : 420);
      id = o.suite;
      continue;
    }

    if(e.fin){
      if(e.confettis !== false) confettis(110);
      hoche(1.3); epaules();
      $('#finalTexte').textContent = CFG.textes.fin;
      $('#stage').classList.add('fin');
      final_.classList.add('vu');
      $('#recommencer').classList.add('vu');
      return;
    }
    id = e.suite;
  }
}

/* ---------- reprendre ---------- */
$('#recommencer').textContent = CFG.textes.recommencer;
$('#recommencer').onclick = () => {
  enCours++;
  Object.keys(memoire).forEach(k => delete memoire[k]);
  fil.innerHTML = '';
  $('#stage').classList.remove('fin');
  cacheTout();
  $('#recommencer').classList.remove('vu');
  planActuel = null; poseActuelle = null;
  joue(CFG.depart, enCours);
};

/* ---------- mise à l'échelle ---------- */
function ajuste(){
  const k = Math.min(innerWidth/1600, innerHeight/900);
  const st = $('#stage'), cd = $('#cadre');
  st.style.transform = `scale(${k})`;
  cd.style.width  = (1600*k)+'px';
  cd.style.height = (900*k)+'px';
}
addEventListener('resize', ajuste);

/* ---------- départ ---------- */
ajuste();
joue(CFG.depart, enCours);
</script>
